name: "release"

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'main'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Build release APK"
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --stacktrace; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 15))
            echo "Build attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: "Rename APK"
        run: | 
          # assume there is only one APK in that folder
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/PipeLoad-$VERSION_NAME.apk"

      - uses: ilharp/sign-android-release@v2
        name: "Sign app APK"
        id: sign_app
        env:
           ANDROID_SIGNING_KEY: ${{ secrets.SIGNING_KEY_STORE }}
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY_STORE }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: ${{ steps.sign_app.outputs.signedFile }}
