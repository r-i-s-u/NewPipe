name: Fix malformed XML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: download
          fetch-depth: 0
      - name: Remove malformed android attribute
        run: |
          file="app/src/main/res/layout/fragment_video_detail.xml"
          sed -i '/^[[:space:]]*android:[[:space:]]*$/d' "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git diff --cached --quiet || git commit -m "Fix malformed XML attribute"
          git push origin HEAD:download
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-xml.yml
          git commit -m "Remove temporary XML fix workflow"
          git push origin HEAD:download
