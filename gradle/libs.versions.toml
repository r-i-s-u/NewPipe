[versions]
about-libraries = "15.1.1"
activity = "1.13.0"
agp = "9.3.1"
appcompat = "1.8.0"
assertj = "3.27.7"
bridge = "v2.0.2"
browser = "1.10.0"
cardview = "1.0.0"
checkstyle = "13.8.0" # See https://github.com/checkstyle/checkstyle/issues/21175
compose = "1.12.0"
constraintlayout = "2.2.2"
core = "1.19.0"
coroutines = "1.11.0"
desugar = "2.1.5"
documentfile = "1.1.0"
espresso = "3.7.0"
fragment = "1.9.0"
groupie = "2.10.1"
jsoup = "1.23.1"
junit = "4.13.2"
junit-ext = "1.3.0"
koin = "4.2.2"
koin-plugin = "1.1.0"
kotlin = "2.4.10"
kotlinx-coroutines-rx3 = "1.11.0"
kotlinx-serialization-json = "1.11.0"
ktlint = "1.8.0"
leakcanary = "2.14"
lifecycle = "2.11.0"
localbroadcastmanager = "1.1.0"
material = "1.11.0" # TODO: update to newer version after bug is fixed. See https://github.com/TeamNewPipe/NewPipe/pull/13018
material3 = "1.11.0-alpha07"
mockitoCore = "5.23.0"
multiplatform = "1.11.1"
navigation3 = "1.1.1"
okhttp = "5.5.0"
phoenix = "3.0.0"
preference = "1.2.1"
recyclerview = "1.4.0"
runner = "1.7.0"
rxandroid = "3.0.2"
rxbinding = "4.0.0"
rxjava = "3.1.12"
sonarqube = "7.4.0.8496"
statesaver = "1.4.1" # TODO: Drop because it is deprecated and incompatible with KSP2
swiperefreshlayout = "1.2.0"
# You can use a local version by uncommenting a few lines in settings.gradle
# Or you can use a commit you pushed to GitHub by just replacing TeamNewPipe with your GitHub
# name and the commit hash with the commit hash of the (pushed) commit you want to test
# This works thanks to JitPack: https://jitpack.io/
teamnewpipe-filepicker = "5.0.0"
teamnewpipe-nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
# WORKAROUND: if you get errors with the NewPipeExtractor dependency, replace `v0.XX.Y` with
# the corresponding commit hash, since JitPack sometimes deletes artifacts.
# If there’s already a git hash, just add more of it to the end (or remove a letter)
# to cause jitpack to regenerate the artifact.
teamnewpipe-newpipe-extractor = "13a655fe53e0c3065f88725fc1fb594c3ede016"
viewpager2 = "1.1.0"
webkit = "1.15.0" # New versions require minSdk 24

